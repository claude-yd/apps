<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문구 서랍</title>
<meta name="description" content="자주 쓰는 문자·카톡 문구를 저장해두고 한 번에 복사하는 개인용 보관함">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="문구 서랍">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f6b5f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 고정 헤더(검색·분류) 아래 한 줄 카드 목록, 우하단 추가 버튼, 하단 시트로 편집 */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e7eeeb; --line:#d6e0dc;
  --fg:#15201d; --muted:#5c6e69; --accent:#0f6b5f; --accent-fg:#ffffff;
  --star:#b07d10; --danger:#a63d2f;
  --shadow:0 1px 2px rgba(18,40,36,.06), 0 6px 18px rgba(18,40,36,.07);
  --ui:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#18211f; --surface-2:#212c2a; --line:#2b3836;
    --fg:#e5ecea; --muted:#92a5a0; --accent:#4fd1b9; --accent-fg:#06211c;
    --star:#dfb45a; --danger:#e58775;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18211f; --surface-2:#212c2a; --line:#2b3836;
  --fg:#e5ecea; --muted:#92a5a0; --accent:#4fd1b9; --accent-fg:#06211c;
  --star:#dfb45a; --danger:#e58775;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---- 헤더 ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 0;display:flex;flex-direction:column;gap:10px;
  max-width:720px;margin:0 auto;
}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.brand .sp{flex:1}
.brand .bk{font-size:12.5px;color:var(--muted);padding:4px 9px;border-radius:999px;background:var(--surface-2);font-weight:500}
.search{position:relative;display:flex;align-items:center}
.search .mag{position:absolute;left:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding:10px 34px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);-webkit-appearance:none}
.search input::placeholder{color:var(--muted)}
.search .clear{position:absolute;right:6px;width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}

/* ---- 목록 ---- */
main{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));
  max-width:720px;margin:0 auto;
}
.sortbar{display:flex;gap:4px;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.sortbar button{padding:4px 9px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.sortbar button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);font-weight:600}
.list{display:flex;flex-direction:column;gap:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:stretch;overflow:hidden}
.tap{flex:1;min-width:0;text-align:left;padding:12px 4px 12px 14px;display:flex;flex-direction:column;gap:3px}
.tap:active{background:var(--surface-2)}
.row1{display:flex;align-items:center;gap:7px;min-width:0}
.ttl{font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:0 0 auto;font-size:11px;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:2px 6px}
.tag.ex{color:var(--accent)}
.prev{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.prev var{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--surface-2);border-radius:4px;padding:0 3px}
.meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.side{flex:0 0 auto;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.side button{width:46px;flex:1;display:grid;place-items:center;color:var(--muted)}
.side button:active{background:var(--surface-2)}
.side button + button{border-top:1px solid var(--line)}
.side svg{width:17px;height:17px}
.fav[aria-pressed="true"]{color:var(--star)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.empty{border:1px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:7px;align-items:center}
.empty h2{margin:0;font-size:15px;font-weight:600}
.empty p{margin:0;font-size:13px;color:var(--muted);max-width:30ch}
.hint{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.hint b{font-weight:600;color:var(--fg)}

/* ---- 추가 버튼 ---- */
.fab{
  position:fixed;z-index:18;
  right:calc(16px + env(safe-area-inset-right,0px));
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  height:52px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--accent-fg);
  font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(15,107,95,.3);display:flex;align-items:center;gap:7px;
}
.fab svg{width:17px;height:17px}

/* ---- 시트 ---- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,20,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line);max-height:88%;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:15px;font-weight:700}
.sheet-b{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:13px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);-webkit-appearance:none}
.field textarea{min-height:130px;resize:vertical;line-height:1.6}
.varhint{margin:0;font-size:11.5px;color:var(--muted)}
.varhint code{font-family:var(--mono);font-size:11px;background:var(--surface-2);border-radius:4px;padding:1px 4px;color:var(--accent)}
.btn{flex:1;height:46px;border-radius:12px;font-weight:600;display:grid;place-items:center}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.del{background:none;color:var(--danger);flex:0 0 auto;padding:0 14px;border:1px solid var(--line)}
.btn.del.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:19px;line-height:1}
#bkData{min-height:150px;font-family:var(--mono);font-size:11.5px;line-height:1.45}
.bk-note{margin:0;font-size:12px;color:var(--muted);line-height:1.6}

/* ---- 토스트 ---- */
.toast{
  position:fixed;z-index:40;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:13.5px;font-weight:600;opacity:0;transition:opacity .18s ease, transform .18s ease;
  pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <h1>문구 서랍</h1><span class="count" id="count"></span>
      <span class="sp"></span>
      <button class="bk" id="bkOpen">백업</button>
    </div>
    <div class="search">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="제목·내용 검색" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clear" id="qclear" hidden aria-label="검색어 지우기">✕</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main>
  <div class="sortbar">
    <span>정렬</span>
    <button id="sortUse" aria-pressed="true">자주 쓴 순</button>
    <button id="sortNew" aria-pressed="false">최근 수정순</button>
  </div>
  <div class="list" id="list"></div>
  <p class="hint">탭하면 바로 복사됩니다. 카톡·문자 입력창에서 길게 눌러 붙여넣으세요.<br>
  문구는 이 아이폰 안에만 저장됩니다. 가끔 <b>백업</b>을 눌러 내용을 따로 보관해 두세요.</p>
</main>

<button class="fab" id="add">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 문구
</button>

<div class="scrim" id="editScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="sheet-h"><h2 id="editTitle">새 문구</h2><button class="x" id="editClose" aria-label="닫기">✕</button></div>
    <div class="sheet-b">
      <div class="field"><label for="fTitle">제목</label><input id="fTitle" placeholder="예: 연차 신청 메시지" autocomplete="off"></div>
      <div class="field"><label for="fCat">분류</label><input id="fCat" list="catList" placeholder="예: 업무, 인사말" autocomplete="off"><datalist id="catList"></datalist></div>
      <div class="field">
        <label for="fBody">내용</label>
        <textarea id="fBody" placeholder="복사할 문구를 적어주세요"></textarea>
        <p class="varhint">바뀌는 부분은 <code>[[이름]]</code>처럼 감싸두면, 복사할 때마다 채워 넣을 수 있습니다.</p>
      </div>
    </div>
    <div class="sheet-f"><button class="btn del" id="fDel" hidden>삭제</button><button class="btn primary" id="fSave">저장</button></div>
  </div>
</div>

<div class="scrim" id="fillScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fillTitle">
    <div class="sheet-h"><h2 id="fillTitle">내용 채우기</h2><button class="x" id="fillClose" aria-label="닫기">✕</button></div>
    <div class="sheet-b" id="fillBody"></div>
    <div class="sheet-f"><button class="btn ghost" id="fillCancel">취소</button><button class="btn primary" id="fillCopy">복사하기</button></div>
  </div>
</div>

<div class="scrim" id="bkScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bkTitle">
    <div class="sheet-h"><h2 id="bkTitle">백업과 복원</h2><button class="x" id="bkClose" aria-label="닫기">✕</button></div>
    <div class="sheet-b">
      <p class="bk-note">아래 내용이 지금 저장된 문구 전체입니다. 복사해서 메모나 메일에 보관해 두세요. 새 기기로 옮길 때는 이 칸에 보관해 둔 내용을 붙여넣고 <b>복원</b>을 누르면 됩니다.</p>
      <div class="field"><label for="bkData">백업 내용</label><textarea id="bkData" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div>
      <p class="bk-note" id="bkMsg"></p>
    </div>
    <div class="sheet-f">
      <button class="btn ghost" id="bkCopy">복사</button>
      <button class="btn ghost" id="bkFile">파일로 저장</button>
      <button class="btn primary" id="bkRestore">복원</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var LKEY = "munggu.v1";
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ toast("저장 공간에 쓸 수 없습니다"); } }

  var SEED = [
    {id:"ex1",title:"회의 일정 안내",cat:"업무",fav:true,sample:true,
     body:"안녕하세요, [[이름]]님.\n\n말씀드린 건 관련해 [[날짜]] [[시간]]에 회의 진행하려 합니다.\n참석 가능하신지 회신 부탁드립니다.\n\n감사합니다."},
    {id:"ex2",title:"서류 보완 요청",cat:"업무",sample:true,
     body:"안녕하세요. 제출해주신 서류 확인했습니다.\n\n아래 항목이 누락되어 보완 요청드립니다.\n- [[누락서류]]\n\n[[기한]]까지 회신해주시면 감사하겠습니다."},
    {id:"ex3",title:"지각·이동 중 연락",cat:"일상",sample:true,
     body:"죄송합니다, 이동 중이라 [[분]]분 정도 늦을 것 같습니다. 도착하면 바로 연락드리겠습니다."},
    {id:"ex4",title:"감사 인사",cat:"인사말",sample:true,
     body:"오늘 시간 내주셔서 감사했습니다. 말씀해주신 내용 잘 정리해서 다시 연락드리겠습니다."},
    {id:"ex5",title:"연락처 안내",cat:"일상",sample:true,
     body:"연락처: [[연락처]]\n이메일: [[이메일]]\n\n확인 후 회신 부탁드립니다."}
  ];

  var state = {
    items: [], cat: lsGet("munggu.cat") || "__all", q: "",
    sort: lsGet("munggu.sort") === "new" ? "new" : "use",
    editId: null, fill: null, armed: false
  };

  /* ---------- 저장 ---------- */
  function load(){
    var raw = lsGet(LKEY);
    if(raw === null){
      var now = Date.now();
      state.items = SEED.map(function(s,i){
        return {id:s.id,title:s.title,body:s.body,cat:s.cat,fav:!!s.fav,sample:true,
                uses:0,lastUsed:0,created:now-i,updated:now-i};
      });
      save();
      return;
    }
    try{
      var v = JSON.parse(raw);
      state.items = Array.isArray(v) ? v : (v && Array.isArray(v.items) ? v.items : []);
    }catch(e){ state.items = []; }
  }
  function save(){ lsSet(LKEY, JSON.stringify(state.items)); }
  function newId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  /* ---------- 렌더 ---------- */
  function cats(){
    var seen = [];
    state.items.forEach(function(s){ var c=(s.cat||"").trim(); if(c && seen.indexOf(c)<0) seen.push(c); });
    return seen.sort(function(a,b){ return a.localeCompare(b,"ko"); });
  }
  function visible(){
    var q = state.q.trim().toLowerCase();
    var out = state.items.filter(function(s){
      if(state.cat === "__fav" && !s.fav) return false;
      if(state.cat !== "__all" && state.cat !== "__fav" && (s.cat||"") !== state.cat) return false;
      if(!q) return true;
      return ((s.title||"")+" "+(s.body||"")+" "+(s.cat||"")).toLowerCase().indexOf(q) >= 0;
    });
    out.sort(function(a,b){
      if((!!b.fav - !!a.fav)) return (!!b.fav - !!a.fav);
      if(state.sort === "use" && (b.uses||0) !== (a.uses||0)) return (b.uses||0)-(a.uses||0);
      return (b.updated||0)-(a.updated||0);
    });
    return out;
  }
  function preview(body){
    return esc(body).replace(/\n+/g," ").replace(/\[\[([^\[\]]{1,40})\]\]/g, function(m,n){ return "<var>"+n+"</var>"; });
  }
  var ICON_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.6 2.6 5.3 5.9.86-4.25 4.14 1 5.86L12 17l-5.25 2.76 1-5.86L3.5 9.76l5.9-.86z"/></svg>';
  var ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.4 2.4 0 0 0-3.4-3.4L4.6 16.6z"/></svg>';

  function render(){
    var list = $("list"), all = state.items.length, rows = visible();
    $("count").textContent = all ? all + "개" : "";
    $("qclear").hidden = !state.q;

    var chips = [["__all","전체"],["__fav","★ 즐겨찾기"]].concat(cats().map(function(c){ return [c,c]; }));
    $("chips").innerHTML = chips.map(function(p){
      return '<button class="chip" data-cat="'+esc(p[0])+'" aria-pressed="'+(state.cat===p[0])+'">'+esc(p[1])+'</button>';
    }).join("");
    $("catList").innerHTML = cats().map(function(c){ return '<option value="'+esc(c)+'"></option>'; }).join("");

    if(!rows.length){
      list.innerHTML = all
        ? '<div class="empty"><h2>해당하는 문구가 없습니다</h2><p>검색어나 분류를 바꿔 보세요.</p></div>'
        : '<div class="empty"><h2>아직 저장된 문구가 없습니다</h2><p>오른쪽 아래 ‘새 문구’를 눌러 자주 쓰는 인사말이나 안내문을 넣어두세요.</p></div>';
      return;
    }
    list.innerHTML = rows.map(function(s){
      var used = (s.uses||0) ? '<span class="meta">'+s.uses+'번 사용</span>' : '';
      var tag = s.sample ? '<span class="tag ex">예시</span>' : (s.cat ? '<span class="tag">'+esc(s.cat)+'</span>' : '');
      return '<article class="card">'
        + '<button class="tap" data-copy="'+s.id+'">'
        +   '<span class="row1"><span class="ttl">'+esc(s.title||"제목 없음")+'</span>'+tag+'</span>'
        +   '<span class="prev">'+preview(s.body||"")+'</span>'+used
        + '</button><div class="side">'
        +   '<button class="fav" data-fav="'+s.id+'" aria-pressed="'+(!!s.fav)+'" aria-label="즐겨찾기">'+ICON_STAR+'</button>'
        +   '<button data-edit="'+s.id+'" aria-label="편집">'+ICON_EDIT+'</button>'
        + '</div></article>';
    }).join("");
  }

  var tt;
  function toast(msg){
    var el = $("toast"); el.textContent = msg; el.classList.add("on");
    clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove("on"); }, 1700);
  }

  /* ---------- 복사 ---------- */
  function copyNow(text){
    var ok = false;
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ if(!ok) toast("복사했습니다"); },
        function(){ if(!ok) toast("복사하지 못했습니다. 편집에서 직접 선택해 주세요"); });
      if(ok) toast("복사했습니다");
      return;
    }
    toast(ok ? "복사했습니다" : "복사하지 못했습니다. 편집에서 직접 선택해 주세요");
  }
  function bumpUse(s){ s.uses = (s.uses||0)+1; s.lastUsed = Date.now(); save(); render(); }
  function varsIn(body){
    var re = /\[\[([^\[\]]{1,40})\]\]/g, out = [], m;
    while((m = re.exec(body))){ if(out.indexOf(m[1])<0) out.push(m[1]); }
    return out;
  }
  function onCopy(id){
    var s = find(id); if(!s) return;
    var names = varsIn(s.body||"");
    if(!names.length){ copyNow(s.body||""); bumpUse(s); return; }
    state.fill = s;
    $("fillBody").innerHTML = names.map(function(n,i){
      return '<div class="field"><label for="v'+i+'">'+esc(n)+'</label><input id="v'+i+'" data-var="'+esc(n)+'" autocomplete="off"></div>';
    }).join("");
    $("fillScrim").hidden = false;
    var first = $("fillBody").querySelector("input"); if(first) first.focus();
  }
  function find(id){ for(var i=0;i<state.items.length;i++){ if(state.items[i].id===id) return state.items[i]; } return null; }

  /* ---------- 편집 ---------- */
  function openEdit(id){
    var s = id ? find(id) : null;
    state.editId = id || null; state.armed = false;
    $("editTitle").textContent = s ? "문구 편집" : "새 문구";
    $("fTitle").value = s ? (s.title||"") : "";
    $("fCat").value = s ? (s.cat||"") : (state.cat.indexOf("__")===0 ? "" : state.cat);
    $("fBody").value = s ? (s.body||"") : "";
    var del = $("fDel"); del.hidden = !s; del.textContent = "삭제"; del.classList.remove("armed");
    $("editScrim").hidden = false;
    setTimeout(function(){ $(s ? "fBody" : "fTitle").focus(); }, 50);
  }
  function closeEdit(){ $("editScrim").hidden = true; state.editId = null; }
  function doSave(){
    var title = $("fTitle").value.trim(), body = $("fBody").value, cat = $("fCat").value.trim();
    if(!body.trim()){ toast("내용을 입력해 주세요"); $("fBody").focus(); return; }
    var old = state.editId ? find(state.editId) : null;
    if(old){
      old.title = title || old.title; old.body = body; old.cat = cat;
      old.updated = Date.now(); delete old.sample;
    }else{
      state.items.push({
        id:newId(), title:title || body.trim().split("\n")[0].slice(0,24), body:body, cat:cat,
        fav:false, uses:0, lastUsed:0, created:Date.now(), updated:Date.now()
      });
    }
    save(); closeEdit(); render(); toast(old ? "수정했습니다" : "저장했습니다");
  }

  /* ---------- 백업 ---------- */
  function openBk(){
    $("bkData").value = JSON.stringify(state.items, null, 1);
    $("bkMsg").textContent = state.items.length + "개 문구 · " + new Date().toLocaleDateString("ko-KR");
    $("bkScrim").hidden = false;
  }
  function closeBk(){ $("bkScrim").hidden = true; }
  function restore(){
    var raw = $("bkData").value.trim();
    if(!raw){ toast("복원할 내용이 없습니다"); return; }
    var v;
    try{ v = JSON.parse(raw); }catch(e){ toast("내용 형식이 올바르지 않습니다"); return; }
    if(!Array.isArray(v)){ toast("내용 형식이 올바르지 않습니다"); return; }
    var clean = v.filter(function(s){ return s && typeof s.body === "string"; }).map(function(s){
      return {id:String(s.id||newId()), title:String(s.title||""), body:String(s.body||""),
              cat:String(s.cat||""), fav:!!s.fav, uses:Number(s.uses)||0, lastUsed:Number(s.lastUsed)||0,
              created:Number(s.created)||Date.now(), updated:Number(s.updated)||Date.now(), sample:!!s.sample};
    });
    if(!clean.length){ toast("불러올 문구가 없습니다"); return; }
    state.items = clean; save(); render(); closeBk(); toast(clean.length + "개를 불러왔습니다");
  }
  function saveFile(){
    try{
      var blob = new Blob([$("bkData").value], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "문구서랍-백업-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){ toast("파일로 저장하지 못했습니다. 복사 버튼을 써주세요"); }
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-copy],[data-fav],[data-edit],[data-cat]");
    if(!t) return;
    if(t.dataset.copy) return onCopy(t.dataset.copy);
    if(t.dataset.edit) return openEdit(t.dataset.edit);
    if(t.dataset.cat){ state.cat = t.dataset.cat; lsSet("munggu.cat", state.cat); render(); return; }
    if(t.dataset.fav){
      var s = find(t.dataset.fav); if(!s) return;
      s.fav = !s.fav; s.updated = Date.now(); save(); render();
    }
  });
  $("q").addEventListener("input", function(){ state.q = this.value; render(); });
  $("qclear").addEventListener("click", function(){ $("q").value=""; state.q=""; render(); $("q").focus(); });
  $("add").addEventListener("click", function(){ openEdit(null); });
  $("editClose").addEventListener("click", closeEdit);
  $("editScrim").addEventListener("click", function(e){ if(e.target.id==="editScrim") closeEdit(); });
  $("fSave").addEventListener("click", doSave);
  $("fDel").addEventListener("click", function(){
    if(!state.armed){ state.armed = true; this.textContent = "정말 삭제할까요?"; this.classList.add("armed"); return; }
    var id = state.editId;
    state.items = state.items.filter(function(x){ return x.id !== id; });
    save(); closeEdit(); render(); toast("삭제했습니다");
  });
  function setSort(v){
    state.sort = v; lsSet("munggu.sort", v);
    $("sortUse").setAttribute("aria-pressed", String(v==="use"));
    $("sortNew").setAttribute("aria-pressed", String(v==="new"));
    render();
  }
  $("sortUse").addEventListener("click", function(){ setSort("use"); });
  $("sortNew").addEventListener("click", function(){ setSort("new"); });

  function closeFill(){ $("fillScrim").hidden = true; state.fill = null; }
  $("fillClose").addEventListener("click", closeFill);
  $("fillCancel").addEventListener("click", closeFill);
  $("fillScrim").addEventListener("click", function(e){ if(e.target.id==="fillScrim") closeFill(); });
  $("fillCopy").addEventListener("click", function(){
    var s = state.fill; if(!s) return;
    var map = {};
    Array.prototype.forEach.call($("fillBody").querySelectorAll("input"), function(i){ map[i.dataset.var] = i.value; });
    var text = (s.body||"").replace(/\[\[([^\[\]]{1,40})\]\]/g, function(m,n){
      return (map[n] != null && map[n] !== "") ? map[n] : m;
    });
    copyNow(text); bumpUse(s); closeFill();
  });

  $("bkOpen").addEventListener("click", openBk);
  $("bkClose").addEventListener("click", closeBk);
  $("bkScrim").addEventListener("click", function(e){ if(e.target.id==="bkScrim") closeBk(); });
  $("bkCopy").addEventListener("click", function(){ copyNow($("bkData").value); });
  $("bkFile").addEventListener("click", saveFile);
  $("bkRestore").addEventListener("click", restore);

  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!$("bkScrim").hidden) closeBk();
    else if(!$("fillScrim").hidden) closeFill();
    else if(!$("editScrim").hidden) closeEdit();
  });

  load(); setSort(state.sort); render();
})();
</script>
</body>
</html>
